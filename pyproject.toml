[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bijay DSU", email = "bijshakya77@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "deepagents>=0.7.29",
    "fastapi>=0.162.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-litellm>=0.11.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.14",
    "langsmith>=0.14.4",
    "litellm>=1.107.0rc1",
    "mcp>=1.30.0",
    "openai>=3.26.1",
    "pageindex>=0.4.3",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "soundfile>=0.14.0",
    "tavily-python>=0.8.5",
]

[project.scripts]
agentic-ai = "agentic_ai:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
